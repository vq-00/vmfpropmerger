name: Build Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check MinGW
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          $gxx = Get-Command g++ -ErrorAction SilentlyContinue
          $cmake = Get-Command cmake -ErrorAction SilentlyContinue

          if (-not $gcc) {
            Write-Error "gcc was not found"
            exit 1
          }

          if (-not $gxx) {
            Write-Error "g++ was not found"
            exit 1
          }

          if (-not $cmake) {
            Write-Error "cmake was not found"
            exit 1
          }

          gcc --version
          g++ --version
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/vmfpropmerger.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "$exe was not produced"
            exit 1
          }

          Write-Host "Build successful:"
          Get-Item $exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmfpropmerger-windows-x64
          path: build/vmfpropmerger.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/vmfpropmerger.exe
          generate_release_notes: true
          draft: false
          prerelease: false
