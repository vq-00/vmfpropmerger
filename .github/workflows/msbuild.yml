name: Build Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Check CMake
      # ------------------------------------------------------------------

      - name: Check CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --version

      # ------------------------------------------------------------------
      # Configure CLI
      # ------------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release

      # ------------------------------------------------------------------
      # Build CLI
      # ------------------------------------------------------------------

      - name: Build CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config Release `
            --parallel

      # ------------------------------------------------------------------
      # Verify CLI
      # ------------------------------------------------------------------

      - name: Verify CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "build\vmfpropmerger.exe"

          if (-not (Test-Path $exe)) {
            throw "$exe was not produced"
          }

          Write-Host "CLI successfully built:"
          Get-Item $exe

      # ------------------------------------------------------------------
      # Upload CLI artifact
      # ------------------------------------------------------------------

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmfpropmerger-windows-x64
          path: build/vmfpropmerger.exe

      # ------------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/vmfpropmerger.exe
            vmfpropmerger_gui-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false