name: Build Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show project structure
        shell: pwsh
        run: |
          Write-Host "Repository:"
          Get-ChildItem -Recurse -File | ForEach-Object {
            $_.FullName.Replace("$PWD\", "")
          }
      
          Write-Host ""
          Write-Host "Include directory:"
          if (Test-Path "include") {
            Get-ChildItem include -Recurse -File
          } else {
            Write-Error "include directory does not exist"
          }

      - name: Check MinGW
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          $gxx = Get-Command g++ -ErrorAction SilentlyContinue
          $cmake = Get-Command cmake -ErrorAction SilentlyContinue

          if (-not $gcc) {
            Write-Error "gcc was not found"
            exit 1
          }

          if (-not $gxx) {
            Write-Error "g++ was not found"
            exit 1
          }

          if (-not $cmake) {
            Write-Error "cmake was not found"
            exit 1
          }

          Write-Host "GCC:"
          gcc --version

          Write-Host "G++:"
          g++ --version

          Write-Host "CMake:"
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/vmfpropmerger.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "$exe was not produced"
            exit 1
          }

          Write-Host "Build successful:"
          Get-Item $exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: vmfpropmerger-windows-x64
          path: build/vmfpropmerger.exe
